name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/dev-0-foundations

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/unit.log || {
            # Failed tests as an annotation, readable without the log files.
            echo "::error title=unit::$(grep -E -B2 -A25 'FAIL|AssertionError|Counterexample|Error:' /tmp/unit.log | tail -c 15000 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Build both applications
        run: pnpm build

  database:
    name: Database migrations and pgTAP tests
    env:
      # Read by config.toml (auth hook) at every supabase command; never used in CI.
      SEND_SMS_HOOK_SECRET: v1,whsec_Y2ktdGVzdC1vbmx5LXNlY3JldC1ub3QtZm9yLXVzZQ==
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local Supabase (database only)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Replay migrations and seed
        run: supabase db reset

      - name: Run pgTAP tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap.log || {
            # Failing assertions as an annotation, readable without the log files.
            echo "::error title=pgtap::$(grep -E 'not ok|Failed|Looks like|ERROR|Wstat|# +(have|want|got|expected)|\.sql \.\.' /tmp/pgtap.log | tail -c 15000 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run queue-command integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -o pipefail
          pnpm --filter @zelate/queue-service test:db 2>&1 | tee /tmp/db-test.log || {
            # The end of the output as an annotation, readable without the log files.
            echo "::error title=db-test::$(tail -c 20000 /tmp/db-test.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

  e2e:
    name: End-to-end tests
    env:
      # Read by config.toml (auth hook) at every supabase command; never used in CI.
      SEND_SMS_HOOK_SECRET: v1,whsec_Y2ktdGVzdC1vbmx5LXNlY3JldC1ub3QtZm9yLXVzZQ==
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write test-only function secrets
        run: |
          cat > supabase/functions/.env <<EOF
          SEND_SMS_HOOK_SECRET=${SEND_SMS_HOOK_SECRET}
          SMTP_HOST=inbucket
          SMTP_PORT=1025
          PRO_APP_URL=http://localhost:5174
          CLIENT_APP_URL=http://localhost:5173
          MAIL_FROM=no-reply@zelate.test
          PHONE_HASH_SECRET=ci-only-phone-hash-secret-never-used-elsewhere
          CRON_SECRET=ci-only-cron-secret-never-used-elsewhere
          EOF

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor

      - name: Serve Edge Functions
        run: |
          nohup supabase functions serve --env-file supabase/functions/.env > /tmp/functions.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/queue-command || true)
            if [ "$code" = "204" ] || [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          tail -n 50 /tmp/functions.log
          exit 1

      - name: Install Chromium
        run: pnpm --filter @zelate/e2e exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee /tmp/e2e.log || {
            # The end of the output as an annotation, readable without the log files.
            echo "::error title=e2e::$(tail -c 15000 /tmp/e2e.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=functions::$(tail -c 4000 /tmp/functions.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            docker ps --format '{{.Names}}' | grep -E 'supabase_auth' | head -1 | xargs -r docker logs --tail 60 > /tmp/auth.log 2>&1 || true
            echo "::error title=auth::$(grep -iE 'error|warn|sms|otp|hook' /tmp/auth.log | tail -c 4000 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
